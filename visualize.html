<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Evacuation Simulation Visualizer & Inspector</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0b0f19;
      --panel-bg: rgba(17, 24, 39, 0.85);
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-blue: #3b82f6;
      --accent-emerald: #10b981;
      --accent-amber: #f59e0b;
      --accent-red: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --cell-open: #1e293b;
      --cell-wall: #020617;
      --cell-exit: #059669;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.08) 0px, transparent 50%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    header {
      padding: 1.25rem 2rem;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
    }

    .logo-group {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-emerald));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.1rem;
      color: white;
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(to right, #ffffff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .scenario-select {
      background: rgba(30, 41, 59, 0.9);
      color: var(--text-main);
      border: 1px solid var(--card-border);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .scenario-select:hover {
      border-color: var(--accent-blue);
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.25);
    }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 1.5rem;
      padding: 1.5rem 2rem;
      max-width: 1600px;
      margin: 0 auto;
      width: 100%;
    }

    /* Left Viewport & Controls */
    .viewport-card {
      background: var(--panel-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .canvas-container {
      flex: 1;
      width: 100%;
      min-height: 520px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    canvas {
      border-radius: 12px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
      background: #090d16;
      cursor: crosshair;
    }

    .controls-toolbar {
      width: 100%;
      margin-top: 1.25rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--card-border);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .btn-group {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .btn {
      background: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--card-border);
      padding: 0.55rem 1.1rem;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: rgba(59, 130, 246, 0.2);
      border-color: var(--accent-blue);
      transform: translateY(-1px);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent-blue), #2563eb);
      border: none;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
    }

    .btn-primary:hover {
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5);
    }

    .btn-active {
      background: rgba(59, 130, 246, 0.35);
      border-color: var(--accent-blue);
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.3);
    }

    .speed-control {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    input[type=range] {
      accent-color: var(--accent-blue);
      cursor: pointer;
    }

    /* Right Sidebar / Inspector */
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .panel-card {
      background: var(--panel-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 1.25rem;
      backdrop-filter: blur(12px);
    }

    .panel-header {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .badge {
      font-size: 0.75rem;
      padding: 0.2rem 0.6rem;
      border-radius: 12px;
      font-weight: 600;
    }

    .badge-running { background: rgba(16, 185, 129, 0.2); color: var(--accent-emerald); }
    .badge-paused { background: rgba(59, 130, 246, 0.2); color: var(--accent-blue); }
    .badge-done { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    .stat-item {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      padding: 0.75rem 1rem;
      border-radius: 10px;
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-dim);
      text-transform: uppercase;
      font-weight: 600;
    }

    .stat-value {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--text-main);
      font-family: 'JetBrains Mono', monospace;
      margin-top: 0.25rem;
    }

    /* Inspector detail */
    .inspector-rows {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      font-size: 0.85rem;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }

    .info-key { color: var(--text-muted); }
    .info-val { font-family: 'JetBrains Mono', monospace; font-weight: 600; color: var(--text-main); }

    /* Trace Log */
    .trace-list {
      max-height: 180px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
    }

    .trace-item {
      background: rgba(15, 23, 42, 0.6);
      padding: 0.4rem 0.6rem;
      border-radius: 6px;
      border-left: 3px solid var(--accent-blue);
      display: flex;
      justify-content: space-between;
    }

    .trace-item.rejected {
      border-left-color: var(--accent-amber);
      color: #fde68a;
    }

    .trace-item.evac {
      border-left-color: var(--accent-emerald);
      color: #a7f3d0;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-group">
      <div class="logo-icon">AG</div>
      <div>
        <h1>Evacuation Simulation Inspector</h1>
      </div>
    </div>
    <div>
      <select id="scenarioSelector" class="scenario-select">
        <option value="bottleneck">Scenario: Bottleneck (12 Agents)</option>
        <option value="basic_building">Scenario: Basic Building (6 Agents)</option>
      </select>
    </div>
  </header>

  <main>
    <!-- Viewport Canvas -->
    <div class="viewport-card">
      <div class="canvas-container">
        <canvas id="simCanvas"></canvas>
      </div>
      <div class="controls-toolbar">
        <div class="btn-group">
          <button id="btnPlay" class="btn btn-primary">▶ Play</button>
          <button id="btnStep" class="btn">⏭ Step</button>
          <button id="btnReset" class="btn">↺ Reset</button>
        </div>
        <div class="btn-group">
          <button id="btnTogglePaths" class="btn btn-active">Paths: ON</button>
          <button id="btnToggleOcc" class="btn">Occ: OFF</button>
        </div>
        <div class="speed-control">
          <span>Speed:</span>
          <input type="range" id="speedSlider" min="50" max="600" value="250" step="50" />
        </div>
      </div>
    </div>

    <!-- Inspector Sidebar -->
    <div class="sidebar">
      <!-- Dashboard Stats -->
      <div class="panel-card">
        <div class="panel-header">
          <span>Simulation HUD</span>
          <span id="simStatusBadge" class="badge badge-paused">PAUSED</span>
        </div>
        <div class="stats-grid">
          <div class="stat-item">
            <div class="stat-label">Timestep</div>
            <div class="stat-value" id="hudTimestep">0 / 200</div>
          </div>
          <div class="stat-item">
            <div class="stat-label">Active Agents</div>
            <div class="stat-value" id="hudActive">12</div>
          </div>
          <div class="stat-item">
            <div class="stat-label">Evacuated</div>
            <div class="stat-value" id="hudEvacuated">0 (0%)</div>
          </div>
          <div class="stat-item">
            <div class="stat-label">Waiting Now</div>
            <div class="stat-value" id="hudWaiting" style="color: var(--accent-amber);">0</div>
          </div>
        </div>
      </div>

      <!-- Agent Inspector -->
      <div class="panel-card">
        <div class="panel-header">
          <span>Agent Inspector</span>
        </div>
        <div id="inspectorContent" class="inspector-rows">
          <div style="color: var(--text-dim); font-style: italic; text-align: center; padding: 1rem;">
            Click on any agent on the grid to inspect details.
          </div>
        </div>
      </div>

      <!-- Step Trace Log -->
      <div class="panel-card">
        <div class="panel-header">
          <span>Step Trace Log</span>
        </div>
        <div class="trace-list" id="traceList">
          <div style="color: var(--text-dim); text-align: center; padding: 0.5rem;">
            No steps executed yet.
          </div>
        </div>
      </div>
    </div>
  </main>
